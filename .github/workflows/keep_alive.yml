name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (Supabase free tier pauses after 7 days of inactivity)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab to test anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set in GitHub repository secrets."
            echo "Please go to Settings -> Secrets and variables -> Actions and add them."
            exit 1
          fi

          # Clean URL (remove trailing slash if present)
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          BASE_URL="${BASE_URL%/}"

          echo "Pinging Supabase database table..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$BASE_URL/rest/v1/rsvp_responses?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Table endpoint HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Success: Supabase database is active and responded successfully."
            exit 0
          fi

          echo "Table endpoint returned $HTTP_STATUS. Trying root REST schema endpoint as fallback..."
          FALLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$BASE_URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Root endpoint HTTP status: $FALLBACK_STATUS"

          if [ "$FALLBACK_STATUS" -ge 200 ] && [ "$FALLBACK_STATUS" -lt 400 ]; then
            echo "✅ Success: Supabase REST service is active and responsive."
            exit 0
          else
            echo "::error::Failed to reach Supabase. Final status: $FALLBACK_STATUS"
            exit 1
          fi
