name: Deploy Invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate config.js from GitHub Secrets (if provided)
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            cat << 'EOF' > config.js
          window.ENV = {
            SUPABASE_URL: "${{ secrets.SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}",
            RSVP_TABLE: "rsvp_responses"
          };
          EOF
            echo "config.js generated from GitHub Secrets."
          else
            echo "SUPABASE_URL secret not set. Skipping config.js generation (using existing file or local configuration)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
